# Vérifie chaque PR (données, types, lint, tests) : c'est le contrôle exigé avant toute fusion dans main.
name: Vérifications

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # "check" est le nom exigé par le ruleset de main : ne pas le renommer.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  # Un lien mort (404, domaine disparu) fait refuser l'app par Google Play et l'App Store. Les sites anti-robot restent « à lire », sans échec.
  liens:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:links
