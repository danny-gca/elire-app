# Tient à jour la PR de release (version, CHANGELOG, app.json et package.json) ; la fusionner crée le tag vX.Y.Z qui lance le build Android sur EAS.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # Jeton dédié : une PR ouverte avec GITHUB_TOKEN ne lance pas la CI exigée par le ruleset.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
