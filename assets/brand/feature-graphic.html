<!doctype html>
<!-- Bannière du Play Store (1024 x 500), rendue en assets/images/feature-graphic.png par scripts/build-brand.mjs. -->
<html lang="fr">
<meta charset="utf-8" />
<style>
  @font-face { font-family: Literata; src: url(../fonts/Literata-Bold.ttf); font-weight: 700; }
  @font-face { font-family: Atkinson; src: url(../fonts/AtkinsonHyperlegibleNext-Regular.ttf); font-weight: 400; }
  @font-face { font-family: Atkinson; src: url(../fonts/AtkinsonHyperlegibleNext-SemiBold.ttf); font-weight: 600; }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; background: #F6F7F5; color: #1C1E21; }
  /* L'icône et le texte partent de la même ligne : le haut des lettres du titre sur le haut de l'icône. */
  .wrap { position: absolute; left: 112px; top: 50%; transform: translateY(-50%); display: flex; gap: 44px; align-items: flex-start; }
  .tile { flex: none; width: 176px; height: 176px; border-radius: 39px; overflow: hidden; box-shadow: 0 12px 30px rgba(28, 30, 33, 0.12), 0 0 0 1px #E2E5E1; }
  .tile img { display: block; width: 100%; height: 100%; }
  .title { display: flex; align-items: center; gap: 18px; margin: -8px 0 0; font: 700 62px/1 Literata; letter-spacing: -0.5px; }
  /* Les surligneurs se partagent la bannière, comme dans le logo : vert pour l'élection, rose pour la phrase clé. */
  .badge { font: 600 18px/1 Atkinson; padding: 7px 12px 8px; border-radius: 6px; background: rgba(168, 224, 161, 0.9); transform: rotate(-2deg); letter-spacing: 0; }
  .lead { margin: 22px 0 0; font: 700 36px/1.18 Literata; }
  .hl { background: linear-gradient(transparent 40%, rgba(242, 167, 195, 0.9) 40%, rgba(242, 167, 195, 0.9) 92%, transparent 92%); padding: 0 4px; margin: 0 -2px; }
  .sub { margin: 16px 0 0; font: 400 18px/1.35 Atkinson; color: #5B6168; }
  .chips { display: flex; gap: 10px; margin-top: 18px; }
  .chips span { font: 600 14px/1 Atkinson; padding: 8px 12px; border-radius: 8px; background: #E8EBED; color: #3F454B; }
</style>
<body>
  <div class="wrap">
    <div class="tile"><img src="../images/icon.png" alt="" /></div>
    <div>
      <h1 class="title">élire <span class="badge">Présidentielle 2027</span></h1>
      <p class="lead">Faites-vous votre avis.<br />Sans savoir <span class="hl">qui parle</span>.</p>
      <p class="sub">Le comparateur citoyen de programmes et de votes au Parlement</p>
      <div class="chips"><span>100% Local</span><span>Neutre &amp; Sourcé</span><span>Open Source</span></div>
    </div>
  </div>
</body>
</html>
