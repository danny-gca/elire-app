# Lancé par le tag vX.Y.Z que crée la fusion de la PR de release : build Android et iOS puis envoi aux testeurs (piste alpha de Google Play, groupe externe « beta » de TestFlight).
name: Create Production Builds

on:
  push:
    tags: ['v*']

jobs:
  build_android:
    type: build
    params:
      platform: android
      profile: production
  submit_android:
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  build_ios:
    type: build
    params:
      platform: ios
      profile: production
  # Envoi sur TestFlight et ajout au groupe externe « beta » (Beta App Review lancée d'office).
  testflight_ios:
    needs: [build_ios]
    type: testflight
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
      external_groups: ['beta']
