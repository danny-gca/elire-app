# Lancé par le tag vX.Y.Z que crée la fusion de la PR de release : build Android et iOS puis envoi aux testeurs (piste alpha de Google Play, TestFlight).
name: Create Production Builds

on:
  push:
    tags: ['v*']

jobs:
  build_android:
    type: build
    params:
      platform: android
      profile: production
  submit_android:
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  build_ios:
    type: build
    params:
      platform: ios
      profile: production
  # Dépôt sur TestFlight ; ajout au groupe externe « beta » à la main (type testflight avec build_id : plan payant).
  submit_ios:
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
